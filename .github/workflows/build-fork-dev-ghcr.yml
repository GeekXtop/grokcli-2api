name: Build fork development image

on:
  push:
    branches: [local-customizations]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/geekxtop/grokcli-2api

jobs:
  build-test-promote:
    runs-on: ubuntu-latest
    concurrency:
      group: fork-dev-ghcr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Run Python tests
        run: python3 -m unittest discover -v

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Derive candidate tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          sha12="${GITHUB_SHA:0:12}"
          printf 'SHA12=%s\n' "$sha12" >> "$GITHUB_ENV"
          printf 'sha12=%s\n' "$sha12" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: development
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:ci-dev-${{ steps.metadata.outputs.sha12 }}
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-dev-amd64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-dev-amd64,mode=max

      - name: Record candidate digest
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_DIGEST"
          printf 'DIGEST=%s\n' "$CANDIDATE_DIGEST" >> "$GITHUB_ENV"

      - name: Smoke test candidate image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /app/scripts/ci/smoke_dev_image.sh "$IMAGE@$DIGEST"

      - name: Verify branch head is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/local-customizations" --jq '.object.sha')"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "local-customizations advanced from $GITHUB_SHA to $remote_sha; refusing promotion" >&2
            exit 1
          fi

      - name: Promote tested digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:dev" \
            --tag "$IMAGE:local-customizations-dev" \
            --tag "$IMAGE:sha-dev-$SHA12" \
            "$IMAGE@$DIGEST"
